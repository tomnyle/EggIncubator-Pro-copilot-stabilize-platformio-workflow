name: REV3 build
on:
  push:
    branches: ['copilot/rev3-firmware']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EggIncubator-Pro-copilot-stabilize-platformio-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: g++ -std=c++17 -Iinclude test/test_motor_limits.cpp -o /tmp/motor_limits && /tmp/motor_limits
      - run: g++ -std=c++17 -Iinclude test/test_safety_limits.cpp -o /tmp/safety_limits && /tmp/safety_limits
      - run: g++ -std=c++17 -Itest/stubs -Iinclude -Isrc test/test_safety_monitor.cpp -o /tmp/safety_monitor && /tmp/safety_monitor
      - run: g++ -std=c++17 -Iinclude -Isrc test/test_operating_mode.cpp -o /tmp/mode_locked && /tmp/mode_locked
      - run: g++ -std=c++17 -Iinclude -Isrc -DREV3_ALLOW_THERMAL_OUTPUTS=1 -DREV3_ALLOW_TURNER=1 test/test_operating_mode.cpp -o /tmp/mode_auto && /tmp/mode_auto
      - run: pio run -e esp32_upesy
