; PlatformIO Configuration for EggIncubator-Pro
; ESP32-based Automatic Egg Incubator System

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

; Board settings
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB

; Library dependency finder
lib_ldf_mode = chain+

; Serial monitor settings (no hard-coded port so COM can change freely)
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Upload
upload_protocol = esptool
upload_speed = 460800

; Library dependencies
lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; Common include paths
build_flags =
    -DARDUINO_LOG_LEVEL=3
    -DBOARD_ESP32
    -Iinclude
    -Isrc
    -Isrc/controllers
    -Isrc/core
    -Isrc/hardware
    -Isrc/managers

[env:esp32dev]
build_type = release
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=2
    -O2
monitor_filters =
    time

[env:esp32dev_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Og
    -g3
monitor_filters =
    time
    esp32_exception_decoder
