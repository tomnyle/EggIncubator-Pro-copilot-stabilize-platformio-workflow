; PlatformIO Configuration for EggIncubator-Pro
; ESP32-based Automatic Egg Incubator System

[platformio]
default_envs = esp32_upesy

[env:esp32_upesy]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

; Board settings
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L

; Serial monitor settings (no hard-coded port so COM can change freely)
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = time, esp32_exception_decoder

; Upload speed (reduce to 115200 if "Connecting..." hangs)
upload_speed = 460800

; Library dependencies
lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; Build flags
build_flags =
    -DARDUINO_LOG_LEVEL=3
    -DCORE_DEBUG_LEVEL=2
    -DBOARD_ESP32
    -O2
    -Iinclude
    -Isrc
    -Isrc/controllers
    -Isrc/core
    -Isrc/managers